task printMethods {
    doLast {
        if (!project.hasProperty('className')) {
            println "Please provide a class name with -PclassName=..."
            return
        }
        try {
            def cl = Class.forName(project.property('className'))
            cl.getMethods().each { println it }
        } catch (Exception e) {
            println "Error: " + e.getMessage()
        }
    }
}